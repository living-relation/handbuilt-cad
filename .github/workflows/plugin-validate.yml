# Validate the Claude and Cursor plugin manifests.
# `claude plugin validate` is a local file check. It does not need a token.
# Do not pass --strict: a missing version is a warning, and this plugin has no version field.
name: plugin-validate

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: plugin-validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check Cursor plugin JSON
        run: |
          python -m pip install --quiet pytest==9.1.1
          python scripts/check_cursor_plugin.py
          python -m pytest -q tests/test_plugin_manifests.py
      - name: Validate Claude plugin
        env:
          CI: "true"
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-cli" @anthropic-ai/claude-code@2.1.326 --no-fund --no-audit
          export PATH="$RUNNER_TEMP/claude-cli/node_modules/.bin:$PATH"
          claude plugin validate .
