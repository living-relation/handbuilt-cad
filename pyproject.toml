[project]
name = "handbuilt-cad"
version = "0.1.0"
description = "Hand-built CAD toolkit: build scripts, checks, drawings, sim helpers"
requires-python = "==3.13.*"
dependencies = [
  "build123d==0.13.0",
  "trimesh==5.1.1",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "rtree==1.4.1",
  "scikit-learn==1.9.1",
  "shapely==2.2.0",
  "open3d==0.20.0",
  "pyvista==0.49.0",
  "ezdxf==1.4.4",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
required-version = "==0.13.0"
