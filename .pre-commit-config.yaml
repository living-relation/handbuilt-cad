# Optional: for people who use the pre-commit framework. The same checks also run from
# .githooks/ (setup sets core.hooksPath), so a fresh clone is protected without pre-commit.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: guard-staged
        name: block part files, archives, >1 MB files and .env
        entry: sh scripts/guard-staged.sh
        language: system
        pass_filenames: false
