[project]
name = "fairsolid"
version = "0.1.0"
description = "3D scan mesh/point cloud -> accurate, oriented, scaled parametric STEP"
requires-python = ">=3.13"
dependencies = [
  "numpy", "scipy", "trimesh", "pymeshlab", "cadquery",
  "pyransac3d", "typer", "rich", "jinja2", "networkx", "manifold3d", "shapely",
  "fast-simplification", "rtree==1.4.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
fairsolid = "fairsolid.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.13.0"
